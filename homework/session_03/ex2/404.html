<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Không tìm thấy trang</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
  }
  .card {
    width: 100%;
    max-width: 520px;
    padding: 48px 32px;
    text-align: center;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
  }
  .code {
    margin: 0;
    font-size: 96px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: 4px;
    color: #2563eb;
  }
  h1 { margin: 16px 0 8px; font-size: 24px; }
  p { margin: 0 0 12px; line-height: 1.6; color: #475569; }
  .btn {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 28px;
    background: #2563eb;
    color: #ffffff;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
  }
  .btn:hover { background: #1d4ed8; }
  .hint { margin: 24px 0 0; font-size: 13px; color: #94a3b8; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #e2e8f0; }
    .card { background: #1e293b; box-shadow: none; }
    .code { color: #60a5fa; }
    p { color: #cbd5e1; }
    .btn { background: #3b82f6; }
    .btn:hover { background: #2563eb; }
    .hint { color: #64748b; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>Rất tiếc, không tìm thấy trang này</h1>
    <p>Đường dẫn bạn vừa truy cập không tồn tại hoặc đã được di chuyển. Vui lòng kiểm tra lại địa chỉ hoặc quay về trang chủ để tiếp tục.</p>
    <a class="btn" href="/">Quay về trang chủ</a>
    <p class="hint">Mã lỗi: 404 Not Found</p>
  </main>
</body>
</html>
