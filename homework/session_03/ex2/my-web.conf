# /etc/nginx/sites-available/my-web.conf
# Server Block của trang web chính thức "my-web" (cổng 80).
# Bài 2 - Session 03: trang lỗi 404 tùy chỉnh, được bảo vệ bằng "internal".

server {
    # Lắng nghe cổng 80 trên IPv4 và IPv6; đây là server mặc định của cổng 80.
    listen 80 default_server;
    listen [::]:80 default_server;

    # "_" là tên giả, khớp với mọi Host (kể cả truy cập trực tiếp bằng IP).
    server_name _;

    # Thư mục gốc chứa mã nguồn website và tệp index.
    root /var/www/my-web/html;
    index index.html;

    # Nhật ký riêng cho site này, tách khỏi nhật ký chung của Nginx.
    access_log /var/log/nginx/my-web.access.log;
    error_log  /var/log/nginx/my-web.error.log;

    # Khi Nginx sinh ra mã trạng thái 404, thay vì trả trang mặc định,
    # thực hiện chuyển hướng NỘI BỘ sang URI /404.html để phục vụ trang tự thiết kế.
    # Không có dấu "=" (ví dụ "404 =200") nên mã trạng thái gửi cho client vẫn là 404.
    # Chỉ thị đặt ở cấp server nên được kế thừa bởi mọi location bên dưới.
    error_page 404 /404.html;

    location / {
        # Thử lần lượt tệp, thư mục tương ứng với URI; không có thì trả 404
        # (404 này sẽ kích hoạt error_page ở trên).
        try_files $uri $uri/ =404;
    }

    # Dấu "=" nghĩa là khớp CHÍNH XÁC đúng URI /404.html, có độ ưu tiên cao nhất,
    # không bị các location khác (prefix, regex) chen vào.
    location = /404.html {
        # Chỉ rõ thư mục chứa tệp lỗi, không phụ thuộc vào root ở cấp server.
        # Tệp thực tế được đọc: /var/www/my-web/html/404.html
        root /var/www/my-web/html;

        # Chỉ cho phép request nội bộ (error_page, try_files, rewrite, X-Accel-Redirect).
        # Request đến từ bên ngoài (curl, trình duyệt gõ /404.html) bị trả 404;
        # chính 404 đó lại kích hoạt error_page nên người dùng vẫn thấy trang tùy biến.
        internal;
    }
}
